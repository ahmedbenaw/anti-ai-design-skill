# Runs the Windows installer on actual Windows.
#
# Until now install.ps1 had only ever run under PowerShell 7 on macOS. The
# README said so, and that was the last untested half of this repo:
# USERPROFILE, native backslash paths and Windows PowerShell 5.1 were all
# assumptions. A windows-latest runner is real Windows, so they do not have to
# stay assumptions.
#
# Each job that cares runs twice: once under `powershell`, which is Windows
# PowerShell 5.1 and ships with the OS, and once under `pwsh`, which is
# PowerShell 7. A script that parses under 7 can still fail under 5.1, so both
# must pass.
#
# The test logic lives in installer/ci-*.ps1 rather than in this file. Two
# reasons. PowerShell embedded in YAML cannot be parsed, linted or run by hand
# on a Windows box, and the `shell:` key does not get the matrix context -
# only `run:` does - so the interpreter has to be chosen inside the command.

name: Windows installer

on:
  push:
    paths:
      - 'install.ps1'
      - 'installer/**'
      - 'anti-ai-design-style/**'
      - '.github/workflows/windows-installer.yml'
  pull_request:
  workflow_dispatch:

jobs:
  parser:
    name: Parser check
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        exe: [powershell, pwsh]
    steps:
      - uses: actions/checkout@v4

      - name: PowerShell's own parser over install.ps1
        shell: cmd
        run: ${{ matrix.exe }} -NoProfile -ExecutionPolicy Bypass -File installer\check-install-ps1.ps1

      - name: And over the scripts this workflow runs
        shell: cmd
        run: |
          ${{ matrix.exe }} -NoProfile -ExecutionPolicy Bypass -File installer\check-install-ps1.ps1 -Path installer\ci-run-selftests.ps1
          if errorlevel 1 exit /b 1
          ${{ matrix.exe }} -NoProfile -ExecutionPolicy Bypass -File installer\check-install-ps1.ps1 -Path installer\ci-install-roundtrip.ps1
          if errorlevel 1 exit /b 1

  selftests:
    name: Scanner selftests on Windows
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Every scanner, on native Windows paths
        shell: cmd
        # The venv probe, the path joins and the transcript reader have only
        # ever run against forward slashes. Here they get backslashes.
        run: pwsh -NoProfile -File installer\ci-run-selftests.ps1 -ScriptsDir anti-ai-design-style\scripts

  install-roundtrip:
    name: Install round trip
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        exe: [powershell, pwsh]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Dry run, install, selftest, reinstall, uninstall
        shell: cmd
        run: ${{ matrix.exe }} -NoProfile -ExecutionPolicy Bypass -File installer\ci-install-roundtrip.ps1

  download-path:
    name: Install from the published zip, with no clone
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Run install.ps1 alone in an empty folder
        shell: pwsh
        run: |
          # The one-liner path: irm ... | iex. With no skill folder beside the
          # script the installer downloads main.zip and unpacks it, and that
          # branch has never run on Windows either.
          $staging = Join-Path $env:RUNNER_TEMP 'lone-installer'
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Copy-Item install.ps1 (Join-Path $staging 'install.ps1')
          Push-Location $staging
          try {
            ./install.ps1 -Yes
            $code = $LASTEXITCODE
          } finally {
            Pop-Location
          }
          if ($code -ne 0) { throw "download-path install exited $code" }
          $plugin = Join-Path $env:USERPROFILE '.claude\skills\anti-ai-design-style\.claude-plugin\plugin.json'
          if (-not (Test-Path $plugin)) { throw "the download path installed nothing" }
          $v = (Get-Content $plugin -Raw | ConvertFrom-Json).version
          Write-Host "downloaded and installed version $v"
